<!-- ── FORM SECTION ────────────────────────────────────────────────────── -->
<section class="form-section">
  <div class="form-container reveal visible">
    <div class="form-header">
      <h1 class="form-title">Kontakt os</h1>
      <p class="form-subtitle">Skriv til os for at påbegynde din digitale rejse.</p>
    </div>
    
    <form action="https://formsubmit.co/antonio.visceglia@nativeworks.studio" method="POST">
      <!-- FormSubmit Config -->
      <input type="hidden" name="_cc" value="info@nativeworks.studio">
      <input type="hidden" name="_next" value="https://www.nativeworks.studio/da/thank-you.html">
      <input type="hidden" name="_captcha" value="false">
      <input type="hidden" name="_subject" value="New Contact Request (DA) — NativeWorks">
      <input type="hidden" name="_template" value="box">

      <div class="form-group">
        <label for="name" class="form-label">Navn</label>
        <input type="text" id="name" name="name" class="form-input" required placeholder="Dit navn">
      </div>

      <div class="form-group">
        <label for="email" class="form-label">E-mail</label>
        <input type="email" id="email" name="email" class="form-input" required placeholder="din@email.dk">
      </div>

      <div class="form-group">
        <label for="discovery" class="form-label">Hvordan hørte du om os?</label>
        <select id="discovery" name="discovery" class="form-select" required>
          <option value="" disabled selected>Vælg en mulighed</option>
          <option value="X">X (Twitter)</option>
          <option value="Nostr">Nostr</option>
          <option value="Website">Hjemmeside</option>
          <option value="Friend">Ven</option>
        </select>
      </div>

      <div class="form-group">
        <label for="message" class="form-label">Emne for henvendelse</label>
        <textarea id="message" name="message" class="form-textarea" required placeholder="Hvordan kan vi hjælpe dig?"></textarea>
      </div>

      <button type="submit" class="form-submit">Send besked →</button>
    </form>
  </div>
</section>
